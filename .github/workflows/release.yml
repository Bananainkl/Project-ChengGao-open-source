name: 发布 GitHub Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要重新构建和上传安装包的标签（例如 v1.20.2）
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_REF: ${{ github.event.pull_request.head.sha || inputs.tag || github.ref }}
  TARGET_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - name: 用 Xcode 27 构建应用
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        run: |
          ./script/bootstrap_runtime.sh
          ./script/build_and_run.sh --package
          ditto -c -k --keepParent "dist/澄稿.app" "$RUNNER_TEMP/ChengGao.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: app-for-macos26
          path: ${{ runner.temp }}/ChengGao.zip
          retention-days: 1

  verify:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - name: 使用 macOS 26 ARM64 验收和封装
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: 核对版本与更新说明
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          build="$(tr -d '[:space:]' < BUILD_NUMBER)"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            test "${TARGET_TAG}" = "v${version}"
          fi
          test -s RELEASE_NOTES.md
          grep -Fq "${version}" RELEASE_NOTES.md
          grep -Fq "## ${version} (${build})" CHANGELOG.md

      - name: 缓存本地语音识别运行时
        uses: actions/cache@v4
        with:
          path: |
            .build/bootstrap-cache
            Frameworks/whisper.xcframework
            Models/ggml-small-q5_1.bin
            Licenses/whisper.cpp-LICENSE.txt
          key: chenggao-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/bootstrap_runtime.sh') }}

      - name: 准备并校验语音识别运行时
        run: ./script/bootstrap_runtime.sh

      - name: 测试
        run: swift test -Xswiftc -warnings-as-errors

      - uses: actions/download-artifact@v4
        with:
          name: app-for-macos26
          path: ${{ runner.temp }}/built-app
      - name: 生成并验证 DMG
        run: |
          mkdir -p dist
          ditto -x -k "$RUNNER_TEMP/built-app/ChengGao.zip" dist
          ./script/package_dmg.sh --prebuilt
          version="$(tr -d '[:space:]' < VERSION)"
          dmg="ChengGao-${version}-macOS-arm64.dmg"
          legacy_dmg="澄稿-${version}-macOS-arm64.dmg"

          # 历史标签仍使用中文产物名；手动重跑旧标签时统一转换为
          # GitHub Release 可稳定保留的 ASCII 文件名。
          if [[ ! -f "dist/${dmg}" && -f "dist/${legacy_dmg}" ]]; then
            mv "dist/${legacy_dmg}" "dist/${dmg}"
          fi

          (cd dist && shasum -a 256 "${dmg}" > "${dmg}.sha256")
          hdiutil verify "dist/${dmg}"
          (cd dist && shasum -a 256 -c "${dmg}.sha256")

      - name: 在 macOS 26 从 DMG 安装并启动
        run: ./script/install_local.sh "dist/ChengGao-$(cat VERSION)-macOS-arm64.dmg"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: verified-dmg
          path: dist/ChengGao-*.dmg*
          retention-days: 1

  release:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-dmg
          path: dist
      - name: 创建或更新 GitHub Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          dmg="dist/ChengGao-${version}-macOS-arm64.dmg"
          checksum="${dmg}.sha256"
          notes_file="${RUNNER_TEMP}/chenggao-release-notes.md"

          cp RELEASE_NOTES.md "${notes_file}"
          cat >>"${notes_file}" <<'NOTES'

          ## 安装包说明

          - DMG 面向 Apple Silicon（arm64），并包含本地 Whisper 语音识别模型与许可证。
          - 当前 GitHub Actions 产物使用临时签名，尚未经过 Apple Developer ID 公证；首次打开请按照 DMG 内的安装说明操作。
          - 下载后可使用同名 `.sha256` 文件核对安装包完整性。
          NOTES

          if gh release view "${TARGET_TAG}" >/dev/null 2>&1; then
            gh release edit "${TARGET_TAG}" \
              --title "澄稿 ${TARGET_TAG}" \
              --notes-file "${notes_file}"
          else
            gh release create "${TARGET_TAG}" \
              --verify-tag \
              --title "澄稿 ${TARGET_TAG}" \
              --notes-file "${notes_file}"
          fi

          gh release upload "${TARGET_TAG}" "${dmg}" "${checksum}" --clobber
